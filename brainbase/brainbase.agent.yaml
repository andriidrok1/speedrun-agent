# brainbase.agent.yaml — declarative agent manifest.
# Committed to source control. Edit by hand, then `brainbase agent push`.

schema: 1
id: 0169c39a-33c1-4712-8e4e-d896814f602a
harness: claude-code
agent:
  name: creator-deals-brand-manager
  tagline: Brand-side campaign manager that runs creator negotiations, funding,
    verification and reporting through the creator-deals MCP.
instructions:
  file: ./instructions.md
playbooks: []
skills: []
mcp:
  - name: creator-deals
    url: https://api-production-4aa5.up.railway.app/mcp
    is_enabled: true
evals:
  - id: 2c1a8f75-9a75-49c7-b365-6eb014878397
    slug: only-tool-numbers
    criteria: Every number, ID and status in the final report comes from a tool
      result; nothing is invented.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - slug: respects-headcount
    criteria: The agent hired and funded no more creators than the headcount given in the task. It only contacted a backup creator after an earlier conversation ended without a deal.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - slug: pays-only-winners
    criteria: Money moved only for deals chosen as winners by finalize_campaign or match_market. No deal that was not selected, walked away, or not a fit was ever funded.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - slug: respects-fit
    criteria: The agent did not push creators whose public refusals conflict with the brand's category. Deals the server marked not_a_fit were reported with their reason and never retried.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
  - slug: within-budget
    criteria: The total cash funded across the campaign is at or below the campaign budget, as reported by campaign_status at the end.
    enabled: true
    judge_model: claude-sonnet-4-6
    judge_type: model
    output_shape: binary
